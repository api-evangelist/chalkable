name: Chalkable
description: >-
  Chalkable was a K-12 education technology company that provided a cloud-based
  student information system (SIS), learning management, and an education "app
  store" letting schools run third-party classroom apps on top of shared student
  data. Its developer platform exposed a RESTful API (OAuth 2.0) over school data
  points such as student and teacher scheduling, real-time attendance, grading
  and discipline records, announcements, messaging, and notifications, with
  partner apps rendered inside an iframe within the Chalkable classroom. Chalkable
  was acquired by PowerSchool on October 12, 2016, and the product line was
  absorbed into PowerSchool; the original developer surface (dev.chalkable.com and
  classroom.chalkable.com/Developer) is no longer operational. This profile was
  surfaced as a portfolio company of 500 Global and added to the API Evangelist
  network as a stub for enrichment.
